# 전체 스택: PostgreSQL + Spring 서버 + Go 봇.
#
#   기본(postgres 만):        docker-compose up -d
#   전체 스택(컨테이너 배포):  docker-compose --profile full up -d --build
#
# server/gobot 은 `full` 프로필 뒤에 둔다 — 이 호스트처럼 Spring/Go 를 bare-metal 로 돌리는
# 환경에서 무심코 `up -d` 했을 때 호스트 8080/3000 과 충돌하지 않도록 하는 안전장치.
# 사전 조건(전체 스택): .env 작성 + 호스트에서 `claude login` (Claude CLI 인증을 볼륨으로 재사용).
services:
  postgres:
    image: postgres:16-alpine
    container_name: jirabot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jirabot}
      POSTGRES_USER: ${POSTGRES_USER:-jirabot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env (see prepare/07-run-order.md)}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: .
    container_name: jirabot-server
    restart: unless-stopped
    profiles: ["full"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres        # 컨테이너 네트워크에서 DB 호스트 오버라이드
    ports:
      - "8080:8080"
    volumes:
      - ${HOME}/.claude:/root/.claude   # Claude CLI 구독 인증 재사용 (호스트에서 claude login 선행)
    depends_on:
      postgres:
        condition: service_healthy

  gobot:
    build: ./bot
    container_name: jirabot-gobot
    restart: unless-stopped
    profiles: ["full"]
    env_file: .env
    environment:
      SPRING_EVENT_URL: http://server:8080/api/slack/event
      SPRING_INTERACTION_URL: http://server:8080/api/slack/interaction
      SPRING_JIRA_WEBHOOK_URL: http://server:8080/api/jira/webhook
      SPRING_BASE_URL: http://server:8080   # 대시보드 프록시용 (DASHBOARD_USER/PASSWORD 는 .env)
    ports:
      - "3000:3000"
    depends_on:
      - server

  # 문서 질문(`@지라 질문 <소스> <질문>`)용 검색 사이드카 (v0.0.99). 임베딩 모델과 문서 조각을 메모리에 올려 둔다.
  #   띄우기:        docker-compose --profile rag up -d --build rag
  #   문서 다시 만들기: scripts/rag-build.sh <소스>
  # 문서 원문·키·소스 목록은 repo 밖의 RAG_DATA_DIR 에만 둔다. 포트는 이 서버 안에서만 열린다.
  rag:
    build: ./rag
    container_name: jirabot-rag
    restart: unless-stopped
    profiles: ["rag"]
    user: "${RAG_UID:-1001}:${RAG_GID:-1001}"
    environment:
      RAG_DATA_DIR: /data
      HF_HOME: /data/hf
      HOME: /data/home
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ${RAG_DATA_DIR:-/home/ubuntu/jirabot-rag}:/data
    mem_limit: 4g
    # pyenvector 가 SecKey 를 메모리에 잠그려면 memlock 제한을 풀어야 한다 (envector 연결 단계에서 사용).
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

volumes:
  postgres-data:
