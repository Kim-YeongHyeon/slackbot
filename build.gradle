plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.jirabot'
version = '0.0.57-SNAPSHOT'
description = 'Jira Slack Bot Server'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	// STUDY: macOS에서 Netty DNS resolver 네이티브 라이브러리. 없으면 시스템 DNS fallback은 되지만 경고 로그 반복.
	runtimeOnly 'io.netty:netty-resolver-dns-native-macos::osx-aarch_64'
	// STUDY: spring-retry / spring-aspects 는 Spring Boot BOM이 버전을 관리한다.
	//        Boot 버전 업그레이드 시 자동으로 호환 버전으로 따라간다. 명시 버전을 박지 않는 것은 의도된 정책.
	implementation 'org.springframework.retry:spring-retry'
	implementation 'org.springframework:spring-aspects'
	// STUDY: Spring Cache 추상화(@Cacheable) + Caffeine 구현체. 버전은 Boot BOM 이 관리.
	//        활성 스프린트처럼 "자주 읽고 드물게 바뀌는" 외부 API 응답을 짧은 TTL 로 흡수한다.
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'com.github.ben-manes.caffeine:caffeine'
	// STUDY: Flyway 10.x 부터 DB 별 지원이 모듈로 분리 — PG 는 flyway-database-postgresql 필수.
	//        스키마는 V<N>__*.sql 마이그레이션으로만 변경하고 Hibernate 는 validate 로 검증만 한다 (레슨 L8 근본 해결).
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform()
	// STUDY: -Dintent.eval=true 같은 CLI 시스템 프로퍼티는 기본적으로 Gradle 호스트 JVM 에만 적용된다.
	//        JUnit @EnabledIfSystemProperty 가 보는 곳은 test 워커 JVM 이므로 명시적으로 forward 한다.
	systemProperty 'intent.eval', System.getProperty('intent.eval', 'false')
}
